services:
  - type: web
    name: genai-studio
    runtime: node
    plan: free
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false  # Must be set manually in Render dashboard
      - key: PORT
        value: 10000
